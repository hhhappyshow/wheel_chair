cloud_to_scan:
  ros__parameters:
    # Same physical mask as sensor_visualization/body_filter.yaml, in rear-axle base_link.
    body_bounds: [-0.15, 0.80, -0.275, 0.275]
    right_cloud_topic: /mid360_201/points_filtered
    left_cloud_topic: /mid360_202/points_filtered
    # Inverted sensor origin is 0.356 m above ground and at Z=+0.320 m
    # in base_link: floor Z = 0.320 - 0.356 = -0.036 m.
    # TF already applies roll=180 deg. Never flip the points again.
    # Single-frame, per-sensor clusters within seat_link XY radius 1 m.
    # 5 cm 3D connectivity; clusters with fewer than 5 points are suppressed.
    cluster_filter_enabled: true
    cluster_center_x: 0.27
    ground_filter_enabled: true
    ground_z: -0.036
    # Ground band is +/-15 cm; obstacles within this band are classified as ground.
    ground_tolerance: 0.15
    obstacle_height: 0.90
    # Legacy slice is used ONLY when ground_filter_enabled=false.
    height_min: 0.217
    height_max: 0.817
    angle_min: -3.14159265
    angle_max:  3.14159265
    angular_resolution: 0.5   # degrees per bin
    cloud_sync_window: 0.3    # seconds; accept clouds up to this age
    target_frame: base_link

odom_relay:
  ros__parameters:
    source_topic: /odin1/odometry_highfreq
    target_topic: /wheelchair/odom
    child_frame_id: base_link
    source_linear_in_world: true
    publish_control_center: true
    imu_source_topic: /odin1/imu
    imu_target_topic: /wheelchair/imu

twist_to_key:
  ros__parameters:
    source_topic: /wheelchair/sim/drive
    target_topic: /whill/controller/navigation
    linear_threshold: 0.05    # m/s  — below this → stop
    angular_threshold: 0.05   # rad/s

scan_map:
  ros__parameters:
    # 10 m rolling window at 5 cm resolution (200 x 200 cells).
    resolution: 0.05
    size: 10.0
    max_age: 0.3
    # Fuse scans within this window (MID360 non-repetitive coverage).
    history_window: 0.4
    # Unobservable ring beside/behind the chassis treated as free (m); 0 disables.
    # The front is never cleared and must be proven free by returns.
    blind_band: 0.10
