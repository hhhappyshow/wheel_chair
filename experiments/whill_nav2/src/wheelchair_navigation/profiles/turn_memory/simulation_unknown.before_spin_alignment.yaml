collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /local_costmap/published_footprint
      max_points: 2
      simulation_time_step: 0.1
      time_before_collision: 2.0
      type: polygon
      visualize: false
    StopZone:
      action_type: stop
      enabled: true
      fallback:
        linear_max: 10.0
        linear_min: -10.0
        points: '[[0.8, 0.3], [0.8, -0.3], [-0.15, -0.3], [-0.15, 0.3]]'
        theta_max: 10.0
        theta_min: -10.0
      forward_straight:
        linear_max: 2.0
        linear_min: 0.001
        points: '[[-0.15,-0.3],[0.8,-0.3],[0.8,0.3],[-0.15,0.3]]'
        theta_max: 0.01
        theta_min: -0.01
      holonomic: false
      max_points: 5
      reverse_straight:
        linear_max: -0.001
        linear_min: -2.0
        points: '[[-0.15,-0.3],[0.8,-0.3],[0.8,0.3],[-0.15,0.3]]'
        theta_max: 0.01
        theta_min: -0.01
      type: velocity_polygon
      velocity_polygons:
      - reverse_straight
      - forward_straight
      - fallback
      visualize: false
    base_frame_id: base_link
    base_shift_correction: true
    cmd_vel_in_topic: /wheelchair/nav2/cmd_vel_smoothed
    cmd_vel_out_topic: /wheelchair/sim/drive
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - StopZone
    - FootprintApproach
    scan:
      enabled: true
      topic: /wheelchair/scan
      type: scan
    source_timeout: 0.75
    stop_pub_timeout: 2.0
    transform_tolerance: 0.5
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      CostCritic:
        consider_footprint: true
        near_goal_distance: 0.15
        cost_weight: 5.0
      PathAlignCritic:
        offset_from_furthest: 4
        threshold_to_consider: 0.15
        use_path_orientations: true
      PathAngleCritic:
        forward_preference: false
      PathFollowCritic:
        offset_from_furthest: 3
        threshold_to_consider: 0.15
      PreferForwardCritic:
        enabled: false
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.1
      inversion_yaw_tolerance: 0.17453292519943295
      model_dt: 0.05
      motion_model: DiffDrive
      plugin: nav2_rotation_shim_controller::RotationShimController
      vx_max: 0.536622219601921
      vx_min: -0.40367094263942477
      vy_max: 0.0
      wz_max: 0.8108854254075847
      primary_controller: nav2_mppi_controller::MPPIController
      use_path_orientations: true
      rotate_to_goal_heading: true
      angular_dist_threshold: 0.7853981633974483
      angular_disengage_threshold: 0.17453292519943295
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 0.8108854254075847
      max_angular_accel: 0.6
      simulate_ahead_time: 2.0
      closed_loop: true
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      rot_stopped_velocity: 0.1
      stateful: true
      trans_stopped_velocity: 0.05
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.17453292519943295
    goal_checker_plugins:
    - general_goal_checker
    odom_topic: /wheelchair/odom
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.1
      required_movement_radius: 0.05
    progress_checker_plugin: progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[-0.18,-0.33],[0.77,-0.33],[0.77,0.33],[-0.18,0.33]]'
      footprint_padding: 0.0
      global_frame: odom
      height: 10
      inflation_layer:
        cost_scaling_factor: 2.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - static_layer
      - memory_obstacles
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        map_topic: /turn_memory_test/unknown_map
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.15
      update_frequency: 10.0
      use_sim_time: true
      width: 10
      memory_obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        combination_method: 1
        min_obstacle_height: -1.0
        max_obstacle_height: 1.0
        observation_sources: scan
        scan:
          topic: /turn_memory_test/no_returns
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 8.5
