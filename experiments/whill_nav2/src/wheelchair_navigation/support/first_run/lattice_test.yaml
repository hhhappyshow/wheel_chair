planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: /home/whill/eye_ctrl_wheelchair/wheelchair_shared_ws/src/wheelchair_nav2/config/wheelchair_lattice.json
      allow_unknown: false
      allow_reverse_expansion: false
      smooth_path: false
      tolerance: 0.05
      rotation_penalty: 1.0
      analytic_expansion_max_length: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.18,-0.28],[0.77,-0.28],[0.77,0.28],[-0.18,0.28]]'
      footprint_padding: 0.05
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /wheelchair/planning_map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
